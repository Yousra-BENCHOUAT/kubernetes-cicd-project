name: Kubernetes CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install YAML validator
        run: pip install yamllint

      - name: Validate YAML syntax
        run: |
          yamllint -d relaxed configmap.yaml
          yamllint -d relaxed deployment.yaml
          yamllint -d relaxed service.yaml

      - name: Verify required Kubernetes manifests
        run: |
          test -f configmap.yaml
          test -f deployment.yaml
          test -f service.yaml
          echo "All required Kubernetes manifests are present."
